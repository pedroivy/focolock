# Compila a app nativa num Mac do GitHub e publica em
# https://github.com/pedroivy/focolock/releases/download/app-latest/Focolock.zip
name: App macOS

on:
  push:
    branches: [claude/affectionate-volta-g0crb5]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Testes
        run: go test ./...

      - name: Serviço (Go, universal)
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/focolock-arm64 ./cmd/focolock
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/focolock-amd64 ./cmd/focolock
          lipo -create -output build/focolock build/focolock-arm64 build/focolock-amd64

      - name: App (SwiftUI, universal)
        run: |
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          for arch in arm64 x86_64; do
            xcrun swiftc -O -swift-version 5 -parse-as-library -sdk "$SDK" \
              -target "$arch-apple-macos13.0" app/*.swift -o "build/Focolock-$arch"
          done
          lipo -create -output build/Focolock build/Focolock-arm64 build/Focolock-x86_64

      - name: Montar Focolock.app
        run: |
          C=build/Focolock.app/Contents
          mkdir -p "$C/MacOS" "$C/Resources"
          cp app/Info.plist "$C/"
          cp build/Focolock "$C/MacOS/"
          cp build/focolock "$C/Resources/"
          cp internal/guard/assets/Focolock.icns "$C/Resources/"
          codesign --force --deep --sign - build/Focolock.app
          codesign --verify --deep --strict build/Focolock.app
          (cd build && ditto -c -k --keepParent Focolock.app Focolock.zip)

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest build/Focolock.zip build/focolock \
            --title "Focolock (última versão)" \
            --notes "Gerado automaticamente a partir de ${GITHUB_SHA}." \
            --target "$GITHUB_SHA"
